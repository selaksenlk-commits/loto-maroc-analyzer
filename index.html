<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loto Maroc Analyzer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
        }

        header {
            padding: 35px 15px;
            background: #172b46;
        }

        h1 {
            color: #36d6a0;
            font-size: 30px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: #1c2b40;
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
        }

        button {
            background: #16b889;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        footer {
            color: #9caec2;
            padding: 25px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎯 Loto Maroc Analyzer</h1>
    <p>منصة تحليل وإحصائيات اللوتو المغربي</p>
</header>

<div class="container">

    <div class="card">
        <h2>مرحباً بك في محلل اللوتو</h2>
        <p>حلّل نتائج السحوبات السابقة واكتشف الإحصائيات.</p>
        <button onclick="alert('مرحباً بك! سنضيف أدوات التحليل قريباً.')">
            ابدأ التحليل
        </button>
    </div>

    <div class="card">
        <h2>📊 الإحصائيات</h2>
        <p>سنضيف هنا الأرقام الأكثر تكراراً والأقل تكراراً.</p>
    </div>

</div>

<footer>
    Loto Maroc Analyzer © 2026
    <p>أداة إحصائية وليست وسيلة للتنبؤ بنتائج السحب.</p>
</footer>

</body>
</html>
